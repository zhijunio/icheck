services:
  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3000
      SQLITE_DATABASE_PATH: /app/data/icheck.db
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-pro}
    ports:
      - "${ICHECK_PORT:-3000}:3000"
    volumes:
      - icheck-data:/app/data
    restart: unless-stopped

volumes:
  icheck-data:
